version: 2

models:

  - name: int_order_items_enriched
    description: >
      Ventas a nivel línea de pedido, enriquecidas con devoluciones,
      costo de reposición y envío prorrateado.
    columns:
      - name: order_item_id
        description: "Identificador único de la línea de pedido."
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "Pedido al que pertenece la línea."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: customer_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: channel
      - name: order_status
      - name: is_cancelled
        description: "1 si order_status='cancelled', 0 en caso contrario."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_resolved
        description: "1 si el pedido llegó a un estado final (delivered/cancelled)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: quantity
        data_tests:
          - not_null
      - name: unit_price
        data_tests:
          - not_null
      - name: replacement_cost
        data_tests:
          - not_null
      - name: discount_pct
        data_tests:
          - not_null
      - name: gross_amount
        data_tests:
          - not_null
      - name: discount_amount
        data_tests:
          - not_null
      - name: net_sales
        data_tests:
          - not_null
      - name: refund_amount
        data_tests:
          - not_null
      - name: returned_units
        data_tests:
          - not_null
      - name: final_net_sales
        data_tests:
          - not_null
      - name: final_item_cogs
        data_tests:
          - not_null
      - name: allocated_shipping_cost
        data_tests:
          - not_null
      - name: net_profit
        data_tests:
          - not_null

  - name: int_sales_enriched
    description: "Ventas a nivel pedido: agregación de int_order_items_enriched."
    columns:
      - name: order_id
        description: "Identificador único del pedido."
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
      - name: channel
      - name: order_status
      - name: is_cancelled
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_resolved
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: distinct_products
        data_tests:
          - not_null
      - name: total_units
        data_tests:
          - not_null
      - name: gross_amount
        data_tests:
          - not_null
      - name: discount_amount
        data_tests:
          - not_null
      - name: net_sales
        data_tests:
          - not_null
      - name: refund_amount
        data_tests:
          - not_null
      - name: returned_units
        data_tests:
          - not_null
      - name: final_net_sales
        data_tests:
          - not_null
      - name: final_cogs
        data_tests:
          - not_null
      - name: shipping_cost
        data_tests:
          - not_null
      - name: shipping_method
        description: "NULL si el pedido no tiene envío todavía o se canceló."
      - name: net_profit
        data_tests:
          - not_null


